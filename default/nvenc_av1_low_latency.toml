# Default calibration — NVENC AV1, low_latency target.
#
# Opinion-free control group (see svtav1_balanced.toml). Same neutral knobs as
# the SVT-AV1 defaults, measured per backend: `crf` maps to NVENC constant-QP,
# not to SVT-AV1's CRF implementation.
#
# bframes = 0 is a backend limitation, not a tuning opinion: the NVENC backend
# does not wire B-frames yet (the async reordering path is the next stage).
# Do not set it higher until that lands — the backend rejects it explicitly.
#
# No [video.codec_params]: SVT-style parameter strings are meaningless to NVENC,
# and the backend rejects them rather than guessing. Backend knobs (preset,
# tuning) are fixed in the backend for now.
schema_version = 1
source = "default"

[key]
model  = { family = "*", version = "*", quant = "*", size = "*" }
scene  = "*"
codec  = "nvenc_av1"
target = "low_latency"

[video.common]
rate_control = "crf"
crf          = 32
bitrate_kbps = 3000
keyint       = 48
bframes      = 0
pix_fmt      = "yuv420p"
