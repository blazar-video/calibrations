# Default calibration — x264, low_latency target.
#
# Codec-stock control group. UNMEASURED: the CRF/keyint/B-frame ladder mirrors
# the SVT-AV1 defaults so the targets mean the same thing across codecs; it is
# not the result of a rate-distortion sweep.
schema_version = 1
source = "default"

[key]
model  = { family = "*", version = "*", quant = "*", size = "*" }
scene  = "*"
codec  = "x264"
target = "low_latency"

[video.common]
rate_control = "crf"
crf          = 32
bitrate_kbps = 3000
keyint       = 48
bframes      = 0
pix_fmt      = "yuv420p"
