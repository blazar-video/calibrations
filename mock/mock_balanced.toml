# Default calibration — rav1e, balanced target.
#
# Placeholder for the rav1e backend (still a mock). Mirrors the SVT-AV1 ladder so
# target semantics stay comparable. UNMEASURED.
schema_version = 1
source = "default"

[key]
model  = { family = "*", version = "*", quant = "*", size = "*" }
scene  = "*"
codec  = "rav1e"
target = "balanced"

[video.common]
rate_control = "crf"
crf          = 30
bitrate_kbps = 3000
keyint       = 120
bframes      = 3
pix_fmt      = "yuv420p"
